name: update

# 매 거래일 데이터로 발굴 노트 갱신 → data/ 커밋 → GitHub Pages 자동 반영
# kr-sector-charts data 브랜치(수급·시총)가 밤사이 올라오는 시각이 들쭉날쭉해서
# 밤 10시~아침 9시 사이 매시간 확인하고, 새 기준일이 있을 때만 만든다 (없으면 1분 안에 끝남).
on:
  schedule:
    - cron: "23 0-9,22-23 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      force:
        description: "같은 기준일이어도 다시 만들기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 지난달 이전 데이터 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: alpha-${{ github.run_id }}
          restore-keys: alpha-

      - name: 생성
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONWARNINGS: ignore::DeprecationWarning
        run: python -m pipeline.build

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -q -m "data $(python -c "import json;print(json.load(open('data/latest.json',encoding='utf-8'))['asof'])")"
            git push
          fi
